name: Verify and deploy Cadence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deno, Chromium and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check formatting, lint and types
        run: deno task check
      - name: Test music rules and persistence validation
        run: deno task test
      - name: Build browser release
        run: deno task build
      - name: Install browsers and system dependencies
        run: deno run -A npm:playwright@1.62.1 install --with-deps chromium webkit
      - name: Test the built application in Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          BROWSER=chromium deno task test:browser
          BROWSER=webkit deno task test:browser
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/initial-chord-lessons'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: Deploy testing site
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/initial-chord-lessons'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
