name: Verify Cadence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deno and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check formatting, lint and types
        run: deno task check
      - name: Test music rules and persistence validation
        run: deno task test
      - name: Build browser release
        run: deno task build
      - name: Install Chromium and system dependencies
        run: deno run -A npm:playwright@1.62.1 install --with-deps chromium
      - name: Test the built application in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          deno run --allow-net=127.0.0.1:8000 --allow-read=dist tools/serve.ts > test-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat test-results/server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat test-results/server.log
            exit 1
          fi
          deno task test:browser
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
